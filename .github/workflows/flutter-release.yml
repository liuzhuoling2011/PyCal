# Flutter multi-platform release.
#
# Pushing a vX.Y.Z tag (or running this workflow manually with that tag)
# analyzes and tests once, then builds Web, Linux, Windows, macOS, and Android
# in parallel. The publish job uploads whichever of those artifacts were built.
# One platform failure does not skip the others. All five are required: if any
# fails, the assets that did build are still published and the workflow is
# marked failed.
#
# macOS is a Developer ID–signed, notarized, stapled disk image named
# PyCal-<version>.dmg (tag v0.2.1 → PyCal-0.2.1.dmg, tag v0.2.1-rc.1 →
# PyCal-0.2.1-rc.1.dmg). Incomplete Apple secrets fail the macOS job. This
# workflow does not build an ad-hoc macOS zip or an unsigned iOS zip.
# iOS distribution (unsigned zip, TestFlight, App Store) is deferred.
#
# `gh release upload --clobber` replaces files of the same name and does not
# delete other assets. A new tag therefore has one macOS DMG. Older tags such
# as v0.2.1 keep whatever was uploaded then until a new tag is published.

name: Flutter release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (for example v0.2.1). The workflow checks out this tag, not the branch you started from."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: flutter-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  PYCAL_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_name: ${{ steps.version.outputs.build_name }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version from tag
        id: version
        env:
          PYCAL_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${PYCAL_TAG_INPUT}" ]]; then
            tag="${PYCAL_TAG_INPUT}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          tag="${tag#refs/tags/}"
          tag="$(printf '%s' "${tag}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Tag must look like v0.2.1 or v0.2.1-rc.1 (got: ${tag})." >&2
            echo "Push a v*.*.* tag, or run this workflow manually with the tag input set." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build_name="${version%%[-+]*}"
          {
            echo "version=${version}"
            echo "build_name=${build_name}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"
          echo "Release version ${version} (tag ${tag}, build name ${build_name}, build number ${PYCAL_BUILD_NUMBER})"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  web:
    name: Web
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYCAL_VERSION: ${{ needs.quality.outputs.version }}
      PYCAL_BUILD_NAME: ${{ needs.quality.outputs.build_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          set -euo pipefail
          flutter build web --release \
            --build-name="${PYCAL_BUILD_NAME}" \
            --build-number="${PYCAL_BUILD_NUMBER}"
          test -f build/web/index.html
          tar -C build/web -czf "PyCal-${PYCAL_VERSION}-web.tar.gz" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCal-${{ needs.quality.outputs.version }}-web
          path: PyCal-${{ needs.quality.outputs.version }}-web.tar.gz
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x64
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYCAL_VERSION: ${{ needs.quality.outputs.version }}
      PYCAL_BUILD_NAME: ${{ needs.quality.outputs.build_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux desktop dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Linux
        run: |
          set -euo pipefail
          flutter build linux --release \
            --build-name="${PYCAL_BUILD_NAME}" \
            --build-number="${PYCAL_BUILD_NUMBER}"
          bundle="build/linux/x64/release/bundle"
          if [[ ! -f "${bundle}/pycal" ]]; then
            echo "Expected ${bundle}/pycal" >&2
            find build/linux -maxdepth 5 -type f >&2 || true
            exit 1
          fi
          tar -C "${bundle}" -czf "PyCal-${PYCAL_VERSION}-linux-x64.tar.gz" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCal-${{ needs.quality.outputs.version }}-linux-x64
          path: PyCal-${{ needs.quality.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYCAL_VERSION: ${{ needs.quality.outputs.version }}
      PYCAL_BUILD_NAME: ${{ needs.quality.outputs.build_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # path_provider and shared_preferences are Windows plugins, so
      # `flutter build windows` creates symlinks under
      # windows/flutter/ephemeral/.plugin_symlinks. GitHub-hosted windows-latest
      # is an elevated Administrator (SeCreateSymbolicLinkPrivilege) and the
      # runner image already sets LongPathsEnabled
      # (actions/runner-images Configure-BaseImage.ps1). Flutter's Windows
      # GitHub Actions example does not call reg.exe
      # (https://docs.flutter.dev/deployment/windows). This step still sets
      # Developer Mode and long paths, then proves a symlink can be created.
      #
      # Do not invoke reg.exe from the job's default Git Bash shell. MSYS path
      # conversion rewrites /t /f /v /d, and REG.EXE exits "ERROR: Invalid syntax."
      # before the Flutter build starts. PowerShell registry cmdlets avoid that.
      - name: Enable Windows symlink support
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:RUNNER_TEMP) { $env:RUNNER_TEMP = $env:TEMP }

          function Set-RegistryDword {
            param([string]$Path, [string]$Name, [int]$Value)
            try {
              if (-not (Test-Path -LiteralPath $Path)) {
                New-Item -Path $Path -Force | Out-Null
              }
              New-ItemProperty -Path $Path -Name $Name -Value $Value -PropertyType DWord -Force | Out-Null
              Write-Host "Set $Path $Name=$Value"
            } catch {
              Write-Warning "Could not set $Path $Name ($($_.Exception.Message)). The symlink probe below decides whether the build can continue."
            }
          }

          Set-RegistryDword "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" "LongPathsEnabled" 1
          Set-RegistryDword "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" "AllowDevelopmentWithoutDevLicense" 1
          Set-RegistryDword "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" "AllowDevelopmentWithoutDevLicense" 1

          $longPaths = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -ErrorAction SilentlyContinue).LongPathsEnabled
          Write-Host "LongPathsEnabled=$longPaths"

          function Test-SymlinkCreation {
            $probe = Join-Path $env:RUNNER_TEMP ("pycal-symlink-" + [guid]::NewGuid().ToString("N"))
            New-Item -ItemType Directory -Path $probe | Out-Null
            try {
              $target = Join-Path $probe "target.txt"
              $link = Join-Path $probe "link.txt"
              Set-Content -LiteralPath $target -Value "ok" -Encoding ascii
              New-Item -ItemType SymbolicLink -Path $link -Target $target | Out-Null
              $read = (Get-Content -LiteralPath $link -Raw).Trim()
              return ($read -eq "ok")
            } catch {
              Write-Warning "Symlink probe failed: $($_.Exception.Message)"
              return $false
            } finally {
              if (Test-Path -LiteralPath $probe) {
                Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          }

          $canLink = Test-SymlinkCreation
          if (-not $canLink) {
            throw "This runner cannot create symbolic links. Flutter plugin builds need that for windows/flutter/ephemeral/.plugin_symlinks. Developer Mode and LongPathsEnabled were set with PowerShell before this probe."
          }
          Write-Host "Windows symlink probe succeeded."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows
        run: |
          set -euo pipefail
          flutter build windows --release \
            --build-name="${PYCAL_BUILD_NAME}" \
            --build-number="${PYCAL_BUILD_NUMBER}"

      - name: Zip Windows bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path (Get-Location) "build/windows/x64/runner/Release"
          $exe = Join-Path $src "pycal.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            Get-ChildItem -Recurse -ErrorAction SilentlyContinue build | Select-Object -ExpandProperty FullName
            throw "Expected $exe"
          }
          $dest = Join-Path (Get-Location) "PyCal-$env:PYCAL_VERSION-windows-x64.zip"
          if (Test-Path -LiteralPath $dest) {
            Remove-Item -LiteralPath $dest -Force
          }
          Compress-Archive -Path (Join-Path $src "*") -DestinationPath $dest

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCal-${{ needs.quality.outputs.version }}-windows-x64
          path: PyCal-${{ needs.quality.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      PYCAL_VERSION: ${{ needs.quality.outputs.version }}
      PYCAL_BUILD_NAME: ${{ needs.quality.outputs.build_name }}
      LANG: en_US.UTF-8
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Same policy as the old DMG scripts: partial secrets fail in
      # pycal_release_mode. Empty secrets return "unsigned"; this job still
      # refuses that, because a zip or unsigned DMG is not an installable
      # double-click download.
      - name: Require Developer ID and notarization secrets
        run: |
          set -euo pipefail
          # shellcheck source=Scripts/lib-macos-release.sh
          source Scripts/lib-macos-release.sh
          mode="$(pycal_release_mode)"
          if [[ "${mode}" != "notarized" ]]; then
            echo "macOS release requires Developer ID signing, notarization, and stapling." >&2
            echo "Current mode: ${mode}. Refusing to upload an unsigned zip or DMG." >&2
            echo "Set all six secrets from docs/release.md:" >&2
            echo "  DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD, APPLE_TEAM_ID," >&2
            echo "  APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY_P8." >&2
            exit 1
          fi
          echo "Secrets complete: will Developer ID sign, notarize, and staple."

      - name: Import Developer ID certificate
        run: Scripts/ci-import-signing.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Build macOS
        run: |
          set -euo pipefail
          # Xcode still ad-hoc signs (CODE_SIGN_IDENTITY = "-"). Developer ID
          # signing happens in make-macos-dmg.sh so nested Flutter frameworks
          # get the hardened runtime without a Mac App Store provisioning profile.
          flutter build macos --release \
            --build-name="${PYCAL_BUILD_NAME}" \
            --build-number="${PYCAL_BUILD_NUMBER}"
          app="build/macos/Build/Products/Release/PyCal.app"
          if [[ ! -d "${app}" ]]; then
            echo "Expected ${app}" >&2
            find build/macos -maxdepth 6 -type d -name '*.app' >&2 || true
            exit 1
          fi

      - name: Sign, notarize, and package DMG
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/PyCal.app"
          export PYCAL_RELEASE_MODE=notarized
          export PYCAL_DMG_VERSION="${PYCAL_VERSION}"
          mkdir -p dist
          Scripts/make-macos-dmg.sh "${app}" dist
          dmg="dist/PyCal-${PYCAL_VERSION}.dmg"
          if [[ ! -f "${dmg}" ]]; then
            echo "Expected ${dmg}" >&2
            ls -la dist >&2 || true
            exit 1
          fi
          shasum -a 256 "${dmg}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCal-${{ needs.quality.outputs.version }}-macos
          path: dist/PyCal-${{ needs.quality.outputs.version }}.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Delete temporary signing keychain
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${PYCAL_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${PYCAL_KEYCHAIN_PATH}" || true
          fi

  android:
    name: Android APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYCAL_VERSION: ${{ needs.quality.outputs.version }}
      PYCAL_BUILD_NAME: ${{ needs.quality.outputs.build_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          set -euo pipefail
          # android/gradle.properties requests an 8G Gradle heap for local
          # builds. GitHub-hosted runners cannot give the daemon that much
          # RAM, so lower it for this job only. The debug signingConfig in
          # android/app/build.gradle.kts is intentional: there is no Play
          # upload key in CI.
          props="android/gradle.properties"
          tmp="$(mktemp)"
          awk '
            BEGIN { replaced = 0 }
            /^org\.gradle\.jvmargs=/ {
              print "org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError"
              replaced = 1
              next
            }
            { print }
            END { if (replaced != 1) exit 1 }
          ' "${props}" > "${tmp}"
          mv "${tmp}" "${props}"

          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -n "${sdk}" && -x "${sdk}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            yes | "${sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

          # android/gradlew is gitignored by the Flutter template. flutter
          # build apk regenerates the wrapper from the SDK.
          flutter build apk --release \
            --build-name="${PYCAL_BUILD_NAME}" \
            --build-number="${PYCAL_BUILD_NUMBER}"

          apk=""
          for candidate in \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/apk/release/app-release.apk
          do
            if [[ -f "${candidate}" ]]; then
              apk="${candidate}"
              break
            fi
          done
          if [[ -z "${apk}" ]]; then
            echo "Release APK not found" >&2
            find build/app/outputs -type f -name '*.apk' >&2 || true
            exit 1
          fi
          cp "${apk}" "PyCal-${PYCAL_VERSION}-android.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCal-${{ needs.quality.outputs.version }}-android
          path: PyCal-${{ needs.quality.outputs.version }}-android.apk
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [quality, web, linux, windows, macos, android]
    # Upload after analyze/test even when a platform build failed. Required
    # platforms still fail this job after the upload, so the workflow stays red.
    if: "${{ always() && !cancelled() && needs.quality.result == 'success' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      PYCAL_VERSION: ${{ needs.quality.outputs.version }}
      PYCAL_BUILD_NAME: ${{ needs.quality.outputs.build_name }}
      PYCAL_TAG: ${{ needs.quality.outputs.tag }}
      PYCAL_RESULT_WEB: ${{ needs.web.result }}
      PYCAL_RESULT_LINUX: ${{ needs.linux.result }}
      PYCAL_RESULT_WINDOWS: ${{ needs.windows.result }}
      PYCAL_RESULT_MACOS: ${{ needs.macos.result }}
      PYCAL_RESULT_ANDROID: ${{ needs.android.result }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PyCal-*
          path: dist
          merge-multiple: true

      - name: Upload assets and write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          # Publish has no checkout; gh must not rely on ambient git remotes.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mapfile -t files < <(find dist -maxdepth 1 -type f | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release files downloaded into dist/" >&2
            find dist -maxdepth 3 -type f >&2 || true
            exit 1
          fi

          declare -A checksums=()
          for file in "${files[@]}"; do
            name="$(basename "${file}")"
            checksums["${name}"]="$(sha256sum "${file}" | awk '{print $1}')"
          done

          required=(
            "PyCal-${PYCAL_VERSION}-web.tar.gz"
            "PyCal-${PYCAL_VERSION}-linux-x64.tar.gz"
            "PyCal-${PYCAL_VERSION}-windows-x64.zip"
            "PyCal-${PYCAL_VERSION}.dmg"
            "PyCal-${PYCAL_VERSION}-android.apk"
          )
          declare -A required_results=(
            ["PyCal-${PYCAL_VERSION}-web.tar.gz"]="${PYCAL_RESULT_WEB}"
            ["PyCal-${PYCAL_VERSION}-linux-x64.tar.gz"]="${PYCAL_RESULT_LINUX}"
            ["PyCal-${PYCAL_VERSION}-windows-x64.zip"]="${PYCAL_RESULT_WINDOWS}"
            ["PyCal-${PYCAL_VERSION}.dmg"]="${PYCAL_RESULT_MACOS}"
            ["PyCal-${PYCAL_VERSION}-android.apk"]="${PYCAL_RESULT_ANDROID}"
          )
          # Do not exit here. A missing Windows zip must not block the web,
          # Linux, macOS, and Android files that did build. The job fails
          # after upload when a required platform did not succeed.
          missing_required=()
          for name in "${required[@]}"; do
            if [[ -z "${checksums[${name}]+x}" ]]; then
              missing_required+=("${name}")
              echo "Required artifact not produced on this run: ${name} (job result: ${required_results[${name}]})" >&2
            fi
          done

          preexisting="${RUNNER_TEMP}/preexisting.txt"
          if gh release view "${PYCAL_TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release view "${PYCAL_TAG}" -R "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort > "${preexisting}"
          else
            : > "${preexisting}"
          fi

          describe() {
            case "$1" in
              *-web.tar.gz)
                echo "Static website from flutter build web. Unpack the archive and serve that directory."
                ;;
              *-linux-x64.tar.gz)
                echo "Linux x64 release bundle. Unpack it and run ./pycal."
                ;;
              *-windows-x64.zip)
                echo "Windows x64 release build. Unsigned. SmartScreen may warn on first launch."
                ;;
              *-macos.zip)
                echo "Previous ad-hoc macOS zip. This workflow no longer builds it. Use the notarized PyCal-${PYCAL_VERSION}.dmg."
                ;;
              *-android.apk)
                echo "Android release APK signed with the debug keystore. No Play upload key is configured. Sideload only; not acceptable to the Play Store."
                ;;
              *-ios-unsigned.zip)
                echo "Previous unsigned iOS zip. This workflow no longer builds it. iOS distribution is deferred."
                ;;
              *.dmg)
                if [[ -n "${checksums[$1]+x}" ]]; then
                  echo "Flutter macOS disk image. Developer ID signed, notarized, and stapled. Open the DMG, drag PyCal to Applications, then double-click."
                else
                  echo "Already on this release; this run did not upload a replacement. Tags cut before the Flutter DMG change (for example v0.2.1) may still be the old Swift image until a new tag is published."
                fi
                ;;
              *)
                echo "Existing release asset. This workflow does not delete it."
                ;;
            esac
          }

          notes="${RUNNER_TEMP}/flutter-release-notes.md"
          seen="${RUNNER_TEMP}/seen-assets.txt"
          : > "${seen}"
          {
            echo "## PyCal ${PYCAL_VERSION}"
            echo
            echo "Flutter multi-platform build from tag ${PYCAL_TAG}."
            echo
            echo "macOS is \`PyCal-${PYCAL_VERSION}.dmg\`: Developer ID signed, notarized, and stapled. Download it, open the disk image, drag PyCal to Applications, and double-click."
            echo
            echo "Windows is unsigned. Android is signed with the debug keystore. iOS is not built; unsigned iOS and TestFlight are deferred."
            echo
            echo "\`gh release upload --clobber\` replaces files of the same name and does not delete other assets. v0.2.1 and earlier tags keep their previous files until a new tag is published."
            echo
            echo "| Asset | SHA-256 | Notes |"
            echo "| --- | --- | --- |"
          } > "${notes}"

          emit() {
            local name="$1"
            local sum note
            if [[ -n "${checksums[${name}]+x}" ]]; then
              sum="${checksums[${name}]}"
            else
              sum="n/a"
            fi
            note="$(describe "${name}")"
            printf '| %s | %s | %s |\n' "\`${name}\`" "\`${sum}\`" "${note}" >> "${notes}"
            printf '%s\n' "${name}" >> "${seen}"
          }

          preferred=(
            "PyCal-${PYCAL_VERSION}-web.tar.gz"
            "PyCal-${PYCAL_VERSION}-linux-x64.tar.gz"
            "PyCal-${PYCAL_VERSION}-windows-x64.zip"
            "PyCal-${PYCAL_VERSION}.dmg"
            "PyCal-${PYCAL_VERSION}-android.apk"
          )
          for name in "${preferred[@]}"; do
            if [[ -n "${checksums[${name}]+x}" ]] || grep -Fxq "${name}" "${preexisting}"; then
              emit "${name}"
            fi
          done
          while IFS= read -r name || [[ -n "${name}" ]]; do
            [[ -z "${name}" ]] && continue
            if ! grep -Fxq "${name}" "${seen}"; then
              emit "${name}"
            fi
          done < <(printf '%s\n' "${!checksums[@]}" | sort)
          while IFS= read -r name || [[ -n "${name}" ]]; do
            [[ -z "${name}" ]] && continue
            if ! grep -Fxq "${name}" "${seen}"; then
              emit "${name}"
            fi
          done < "${preexisting}"

          if [[ ${#missing_required[@]} -gt 0 ]]; then
            {
              echo
              echo "Some required builds were not produced on this run and are absent from the new uploads. Builds that succeeded were still uploaded with \`gh release upload --clobber\`. This workflow run is marked failed until every required platform succeeds:"
              for name in "${missing_required[@]}"; do
                echo "- \`${name}\` (job result: ${required_results[${name}]})"
              done
            } >> "${notes}"
          fi
          {
            echo
            echo "Version ${PYCAL_BUILD_NAME} is passed to Flutter as --build-name. pubspec.yaml on the branch is not rewritten."
            echo
            echo "Built by .github/workflows/flutter-release.yml: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${notes}"

          release_upload() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "${PYCAL_TAG}" "$@" --clobber -R "${GITHUB_REPOSITORY}"; then
                return 0
              fi
              echo "gh release upload failed (attempt ${attempt}); retrying in $((attempt * 5))s" >&2
              sleep $((attempt * 5))
            done
            echo "gh release upload failed after retries" >&2
            return 1
          }

          if gh release view "${PYCAL_TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_upload "${files[@]}"
          else
            create_args=(--title "PyCal ${PYCAL_VERSION}" --notes-file "${notes}")
            if [[ "${PYCAL_VERSION}" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            if ! gh release create "${PYCAL_TAG}" "${create_args[@]}" "${files[@]}" -R "${GITHUB_REPOSITORY}"; then
              # Another run may have created the release between view and create.
              release_upload "${files[@]}"
            fi
          fi
          edit_args=(--title "PyCal ${PYCAL_VERSION}" --notes-file "${notes}")
          if [[ "${PYCAL_VERSION}" == *-* ]]; then
            edit_args+=(--prerelease)
          fi
          gh release edit "${PYCAL_TAG}" "${edit_args[@]}" -R "${GITHUB_REPOSITORY}"

          listed="${RUNNER_TEMP}/listed-assets.txt"
          gh release view "${PYCAL_TAG}" -R "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort > "${listed}"
          missing=0
          for file in "${files[@]}"; do
            name="$(basename "${file}")"
            if ! grep -Fxq "${name}" "${listed}"; then
              echo "Uploaded file is missing from the release: ${name}" >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

          {
            echo "### Published ${PYCAL_TAG}"
            echo
            cat "${notes}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${PYCAL_TAG}"

          required_failed=0
          for name in "${required[@]}"; do
            result="${required_results[${name}]}"
            if [[ "${result}" != "success" ]]; then
              echo "Required platform job for ${name} result is ${result}." >&2
              required_failed=1
            elif [[ -z "${checksums[${name}]+x}" ]]; then
              echo "Required artifact ${name} is missing even though its job succeeded." >&2
              required_failed=1
            fi
          done
          if [[ "${required_failed}" -ne 0 ]]; then
            echo "Flutter assets that were built are on the release. Failing this job so the workflow stays red: a required platform did not succeed." >&2
            exit 1
          fi
